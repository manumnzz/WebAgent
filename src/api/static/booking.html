<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar cita</title>

    <style>
        :root {
            --booking-bg: #f5f5f5;
            --booking-surface: #fff;
            --booking-text: #222;
            --booking-input-bg: #fff;
            --booking-border: #ccc;
            --booking-accent: #111;
            --booking-accent-text: #fff;
            --booking-slot-bg: #eee;
            --booking-font: system-ui, sans-serif;
        }
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--booking-font);
            background: var(--booking-bg);
            color: var(--booking-text);
        }

        .booking-container {
            max-width: 600px;
            margin: 60px auto;
            padding: 32px;
            background: var(--booking-surface);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input,
        select,
        textarea,
        button {
            width: 100%;
            padding: 12px;
            font: inherit;
            border-radius: 8px;
            border: 1px solid var(--booking-border);
        }

        input,
        select,
        textarea {
            background: var(--booking-input-bg);
            color: var(--booking-text);
        }

        button {
            border: 0;
            cursor: pointer;
            font-weight: 600;
            background: var(--booking-accent);
            color: var(--booking-accent-text);
        }

        button:hover {
            opacity: 0.9;
        }

        .slots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
        }

        .slot {
            background: var(--booking-slot-bg);
            color: var(--booking-text);
        }

        .slot.selected {
            background: var(--booking-accent);
            color: var(--booking-accent-text);
        }

        .message {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            display: none;
        }

        .message.success {
            display: block;
            background: #e8f7ec;
        }

        .message.error {
            display: block;
            background: #fdeaea;
        }
    </style>
    <link rel="stylesheet" href="/booking-theme.css">
</head>

<body>

<div class="booking-container">

    <h1>Citas y propuestas de visita</h1>

    <div class="field">
        <label for="service">¿Qué necesitas?</label>
        <select id="service">
            <option value="">Selecciona un servicio</option>
        </select>
    </div>

    <p id="appointment-explanation" role="status"></p>

    <div class="field">
        <label for="booking-date">Fecha</label>
        <input
            type="date"
            id="booking-date"
        >
    </div>

    <div class="field">
        <label id="time-label">Hora disponible</label>

        <div
            id="slots"
            class="slots"
        ></div>
    </div>

    <form id="booking-form">

        <div class="field">
            <label for="first-name">
                Nombre
            </label>

            <input
                id="first-name"
                required
            >
        </div>

        <div class="field">
            <label for="last-name">
                Apellidos
            </label>

            <input
                id="last-name"
                required
            >
        </div>

        <div class="field">
            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
            >
        </div>

        <div class="field">
            <label for="phone">
                Teléfono
            </label>

            <input
                id="phone"
                type="tel"
            >
        </div>

        <div class="field">
            <label for="notes" id="notes-label">
                Notas
            </label>

            <textarea
                id="notes"
                rows="3"
            ></textarea>
        </div>

        <button type="submit">
            <span id="submit-label">Confirmar reserva</span>
        </button>

    </form>

    <div
        id="message"
        class="message"
    ></div>

</div>

<script>

    const serviceSelect =
        document.getElementById("service");

    const dateInput =
        document.getElementById("booking-date");

    const slotsContainer =
        document.getElementById("slots");

    const form =
        document.getElementById("booking-form");

    const message =
        document.getElementById("message");

    const explanation = document.getElementById("appointment-explanation");
    const submitLabel = document.getElementById("submit-label");
    const notesInput = document.getElementById("notes");
    const submitButton = form.querySelector('button[type="submit"]');
    const optionsById = new Map();

    function isPending() {
        return optionsById.get(serviceSelect.value)?.mode === "pending";
    }

    function isInquiry() {
        return optionsById.get(serviceSelect.value)?.mode === "inquiry";
    }

    function updateOptionExplanation() {
        const pending = isPending();
        const inquiry = isInquiry();
        explanation.textContent = inquiry
            ? "Describe lo que necesitas. El negocio te responderá; no estás reservando una hora."
            : pending
                ? "Elige una hora de llegada propuesta. El negocio confirmará contigo si tiene espacio antes de que acudas; no se reserva el tiempo del trabajo."
                : "La cita se confirma al terminar la reserva.";
        dateInput.closest(".field").hidden = inquiry;
        slotsContainer.closest(".field").hidden = inquiry;
        document.getElementById("time-label").textContent = pending
            ? "Hora de llegada propuesta"
            : "Hora disponible";
        document.getElementById("notes-label").textContent = (pending || inquiry)
            ? "Motivo de la consulta o visita *"
            : "Notas";
        notesInput.required = pending || inquiry;
        submitLabel.textContent = inquiry ? "Enviar consulta"
            : pending ? "Enviar propuesta de llegada"
            : "Confirmar reserva";
    }

    let selectedTime = null;


    async function loadServices() {

        const response = await fetch(
            "/booking/options"
        );

        if (!response.ok) {
            showMessage("No se han podido cargar las citas.", "error");
            return;
        }

        const services = await response.json();

        for (const service of services) {

            optionsById.set(service.id, service);

            const option =
                document.createElement("option");

            option.value = service.id;

            option.textContent =
                service.mode === "pending"
                    ? `${service.name} (hora por confirmar)`
                    : service.mode === "inquiry"
                        ? `${service.name} (consulta sin hora)`
                    : `${service.name} (${service.duration_minutes} min)`;

            serviceSelect.appendChild(option);
        }
        updateOptionExplanation();
    }


    async function loadAvailability() {

        selectedTime = null;
        slotsContainer.innerHTML = "";

        if (isInquiry()) {
            return;
        }

        const serviceId =
            serviceSelect.value;

        const bookingDate =
            dateInput.value;

        if (!serviceId || !bookingDate) {
            return;
        }

        const params =
            new URLSearchParams({
                service_id: serviceId,
                booking_date: bookingDate,
            });

        const route = isPending()
            ? "/booking/request-availability"
            : "/booking/availability";
        const response = await fetch(`${route}?${params}`);

        if (!response.ok) {

            showMessage(
                "No se pudo consultar la disponibilidad.",
                "error"
            );

            return;
        }

        const data = await response.json();

        if (data.available_slots.length === 0) {

            slotsContainer.textContent =
                "No hay horarios disponibles para proponer.";

            return;
        }

        for (const time of data.available_slots) {

            const button =
                document.createElement("button");

            button.type = "button";
            button.className = "slot";
            button.textContent = time;

            button.addEventListener(
                "click",
                () => selectSlot(button, time)
            );

            slotsContainer.appendChild(button);
        }
    }


    function selectSlot(button, time) {

        document
            .querySelectorAll(".slot")
            .forEach(
                slot =>
                    slot.classList.remove(
                        "selected"
                    )
            );

        button.classList.add("selected");

        selectedTime = time;
    }


    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            `message ${type}`;
    }


    form.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            if (!isInquiry() && !selectedTime) {

                showMessage(
                    "Selecciona una hora.",
                    "error"
                );

                return;
            }

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();

            if (!email && !phone) {

                showMessage(
                    "Introduce un email o teléfono.",
                    "error"
                );

                return;
            }

            const body = {

                first_name:
                    document
                        .getElementById("first-name")
                        .value,

                last_name:
                    document
                        .getElementById("last-name")
                        .value,

                email:
                    email || null,

                phone:
                    phone || null,

                service_id:
                    serviceSelect.value,

                notes: notesInput.value.trim() || null,
            };

            const pending = isPending();
            const inquiry = isInquiry();
            if (!inquiry) {
                body.booking_date = dateInput.value;
                body.booking_time = `${selectedTime}:00`;
            }
            const route = inquiry ? "/booking/inquiries"
                : pending ? "/booking/requests" : "/booking";
            submitButton.disabled = true;

            try {
            const response = await fetch(
                route,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body),
                }
            );


            if (response.status === 409) {

                showMessage(
                    "Ese horario acaba de dejar de estar disponible. Elige otro.",
                    "error"
                );

                await loadAvailability();

                return;
            }


            if (!response.ok) {

                const error =
                    await response.json();

                showMessage(
                    error.detail ??
                    "No se pudo realizar la reserva.",
                    "error"
                );

                return;
            }


            const confirmation =
                await response.json();

            showMessage(inquiry
                ? "Consulta recibida. El negocio se pondrá en contacto contigo."
                : pending
                    ? `Propuesta recibida para las ${selectedTime}. El negocio debe confirmarla contigo antes de que acudas.`
                    : `Reserva confirmada: ${confirmation.service_name} a las ${selectedTime}.`,
                "success");

            await loadAvailability();
            } catch (error) {
                showMessage("No se ha podido conectar. Inténtalo de nuevo.", "error");
            } finally {
                submitButton.disabled = false;
            }
        }
    );


    serviceSelect.addEventListener("change", () => {
        updateOptionExplanation();
        loadAvailability();
    });

    dateInput.addEventListener(
        "change",
        loadAvailability
    );


    const localToday = new Date();
    const today = [
        localToday.getFullYear(),
        String(localToday.getMonth() + 1).padStart(2, "0"),
        String(localToday.getDate()).padStart(2, "0")
    ].join("-");

    dateInput.min = today;


    loadServices();

</script>

</body>
</html>
